[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mawkbox"
version = "0.2.1"
description = "A compact audiovisual message encoder and decoder"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "cryptography>=41", "Pillow>=10"]
license = {file = "LICENSE"}

[project.scripts]
mawkbox = "mawkbox.__main__:main"

[tool.setuptools.packages.find]
include = ["mawkbox*"]
